name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/leetcode.yml"

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.plugin.leetcode.svg
          token: NOT_NEEDED
          base: ""
          config_display: large
          config_padding: 0, 0
          plugin_leetcode: yes
          plugin_leetcode_user: venexene
          plugin_leetcode_sections: solved, skills, recent
          extras_css: |
            .items-wrapper {
              box-sizing: border-box;
              padding: 14px 18px;
              background: #000;
              border: 1px solid #fff;
              border-radius: 8px;
              color: #d1d5db;
            }
            .items-wrapper svg { color: #00e5ff; }
            .items-wrapper > section {
              display: grid;
              grid-template-columns: 3fr 2fr;
              gap: 12px 28px;
            }
            .items-wrapper > section > section:first-child {
              grid-column: 1 / -1;
            }
            .leetcode.scores .categories {
              width: 620px;
              margin: 0 auto;
            }
            .leetcode.subsection {
              padding-left: 0;
              margin: 0;
            }
            .leetcode.subsection h2 { font-size: 18px; color: #fff; }
            .items-wrapper .label {
              background-color: #00e5ff22;
              color: #00e5ff;
              font-size: 13px;
              line-height: 24px;
            }
            .leetcode .gauge-arc, .leetcode .dot { color: #00e5ff !important; }
            .leetcode .count, .leetcode .infos .date { color: #a6a6a6 !important; }
            .leetcode.scores .gauge {
              width: 110px !important;
              height: 110px !important;
            }
          extras_js: |
            document.querySelectorAll(".leetcode.scores .gauge").forEach((g) => {
              g.setAttribute("width", "110");
              g.setAttribute("height", "110");
            });
            const leetcodeTitle = document.querySelector("h2.field");
            if (leetcodeTitle) leetcodeTitle.remove();
      - name: Fetch generated card
        run: git pull --rebase
      - name: Reserve space for the wide layout
        run: sed -i -E '1 s/height="[0-9]+"/height="330"/' metrics.plugin.leetcode.svg
      - name: Commit corrected card height
        uses: stefanzweifel/git-auto-commit-action@28e16e81777b558cc906c8750092100bbb34c5e3 # v7.0.0
        with:
          commit_message: "chore: update profile assets"
          file_pattern: metrics.plugin.leetcode.svg
