name: Update project cards

on:
  schedule:
    - cron: "31 2 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/project-cards.yml"
      - "scripts/generate-project-cards.mjs"

permissions:
  contents: write

concurrency:
  group: project-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run generate:projects
      - name: Commit updated cards
        uses: stefanzweifel/git-auto-commit-action@28e16e81777b558cc906c8750092100bbb34c5e3 # v7.0.0
        with:
          commit_message: "chore: update project cards"
          file_pattern: assets/projects/*.svg
