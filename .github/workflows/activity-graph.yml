name: Update activity graph

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/activity-graph.yml"
      - "scripts/generate-activity-graph.mjs"

permissions:
  contents: write

# A scheduled run and a manual/push run can otherwise try to commit the SVG at
# the same time, causing a non-fast-forward push rejection.
concurrency:
  group: activity-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate graph
        env:
          GITHUB_USERNAME: venexene
        run: node scripts/generate-activity-graph.mjs
      - name: Commit updated graph
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update activity graph"
          file_pattern: activity-graph.svg
