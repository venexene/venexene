name: Update activity graph

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - ".github/workflows/activity-graph.yml"
      - "scripts/generate-activity-graph.mjs"

permissions:
  contents: write

# A scheduled run and a manual/push run can otherwise try to commit the SVG at
# the same time, causing a non-fast-forward push rejection.
concurrency:
  group: activity-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Generate graph
        env:
          GITHUB_USERNAME: venexene
        run: npm run generate:activity
      - name: Commit updated graph
        uses: stefanzweifel/git-auto-commit-action@28e16e81777b558cc906c8750092100bbb34c5e3 # v7.0.0
        with:
          commit_message: "chore: update activity graph"
          file_pattern: activity-graph.svg
